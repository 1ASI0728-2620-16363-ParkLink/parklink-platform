apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: service-ingress, namespace: parklink}
spec:
  podSelector:
    matchLabels: {platform: parklink}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {platform: parklink}
      ports: [{protocol: TCP, port: 3000}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: edge-to-gateway, namespace: parklink}
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 3000}]
